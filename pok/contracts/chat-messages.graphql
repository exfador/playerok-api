query chatMessages($hasSupportAccess: Boolean!, $pagination: Pagination, $filter: ChatMessageFilter, $showForbiddenImage: Boolean) {
  chatMessages(pagination: $pagination, filter: $filter) {
    edges {
      ...ChatMessageEdgeFields
      __typename
    }
    pageInfo {
      startCursor
      endCursor
      hasPreviousPage
      hasNextPage
      __typename
    }
    totalCount
    __typename
  }
}

fragment ChatMessageEdgeFields on ChatMessageEdge {
  cursor
  node {
    ...RegularChatMessageWithUserVipStatus
    __typename
  }
  __typename
}

fragment RegularChatMessageWithUserVipStatus on ChatMessage {
  id
  text
  createdAt
  deletedAt
  isRead
  isEdited
  isSuspicious
  isBulkMessaging
  game {
    ...RegularGameProfile
    __typename
  }
  file {
    ...PartialFile
    __typename
  }
  user {
    ...ChatMessageUserFields
    ...UserFragmentVipStatusFragment @include(if: $hasSupportAccess)
    __typename
  }
  deal {
    ...ChatMessageItemDeal
    testimonial {
      ...ChatMessageDealTestimonial
      creator {
        ...RegularUserFragment
        ...UserFragmentVipStatusFragment @include(if: $hasSupportAccess)
        __typename
      }
      __typename
    }
    user {
      ...ChatParticipant
      ...UserFragmentVipStatusFragment @include(if: $hasSupportAccess)
      __typename
    }
    item {
      id
      name
      price
      slug
      rawPrice
      sellerType
      user {
        ...ChatParticipant
        ...UserFragmentVipStatusFragment @include(if: $hasSupportAccess)
        __typename
      }
      category {
        id
        __typename
      }
      attachments(showForbiddenImage: $showForbiddenImage) {
        ...PartialFile
        __typename
      }
      comment
      dataFields {
        ...GameCategoryDataFieldWithValue
        __typename
      }
      obtainingType {
        ...GameCategoryObtainingType
        __typename
      }
      __typename
    }
    __typename
  }
  item {
    ...ItemEdgeNode
    __typename
  }
  transaction {
    ...RegularTransaction
    __typename
  }
  moderator {
    ...UserEdgeNode
    __typename
  }
  eventByUser {
    ...ChatMessageUserFields
    __typename
  }
  eventToUser {
    ...ChatMessageUserFields
    __typename
  }
  isAutoResponse
  event
  buttons {
    ...ChatMessageButton
    __typename
  }
  images {
    ...PartialFile
    __typename
  }
  imageLinks
  uncensorInfo {
    count
    lastEvent {
      username
      createdAt
      __typename
    }
    __typename
  }
  plTokenAmount
  __typename
}

